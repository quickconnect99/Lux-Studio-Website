name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database-migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.101.0

      - name: Apply migrations to fresh local Postgres
        run: supabase db start

      - name: Reapply migrations from a clean database
        run: supabase db reset --no-seed

      - name: Lint database schema
        run: supabase db lint --local --fail-on error

  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Validate Supabase migrations
        run: npm run migrations:check

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'hooks/**', 'lib/**') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build
        env:
          # Optional isolated test-project credentials enable the gated CMS
          # mutation spec. Never point these secrets at production.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: https://www.luxstudio.li
          NEXT_PUBLIC_ENABLE_ADMIN_DEMO: "true"

      - name: Enforce bundle and media budgets
        run: npm run bundle:check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Responsive browser tests
        run: npx playwright test --grep-invert @cms-mutation
        env:
          PLAYWRIGHT_USE_PRODUCTION: "true"

      - name: Authenticated CMS integration test
        env:
          PLAYWRIGHT_USE_PRODUCTION: "true"
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$E2E_ADMIN_EMAIL" ] || [ -z "$E2E_ADMIN_PASSWORD" ] || [ -z "$E2E_SUPABASE_URL" ] || [ -z "$E2E_SUPABASE_ANON_KEY" ]; then
            echo "::notice::Authenticated CMS mutation test skipped: isolated Supabase test credentials are not configured."
            exit 0
          fi
          E2E_ALLOW_CMS_MUTATIONS=true \
          NEXT_PUBLIC_SUPABASE_URL="$E2E_SUPABASE_URL" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$E2E_SUPABASE_ANON_KEY" \
          npx playwright test tests/e2e/admin-integration.spec.ts --project=desktop-1440

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
